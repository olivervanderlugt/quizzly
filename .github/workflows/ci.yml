# Runs on every push to main and every pull request.
#
# No `paths:` filter and no `working-directory:` — this workflow assumes it sits
# at the repository root, which is where GitHub reads workflows from. If Quizzly
# is ever vendored back into a subdirectory of a larger repo, this file stops
# running entirely rather than running against the wrong tree.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The integration tests (`test:e2e`) drive real sockets against a real
    # Postgres, so the job carries one as a service container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quizzly
          POSTGRES_PASSWORD: quizzly
          POSTGRES_DB: quizzly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quizzly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://quizzly:quizzly@localhost:5432/quizzly?schema=public

      - name: Integration tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://quizzly:quizzly@localhost:5432/quizzly?schema=public

      # `npm run build` is `prisma generate && next build`. Prisma resolves
      # env("DATABASE_URL") while reading the datasource block but never opens a
      # connection, so a placeholder is correct here. Next's build phase is
      # handled inside src/lib/env.ts, which substitutes placeholders when
      # NEXT_PHASE === "phase-production-build" — no real secrets are needed to
      # compile, and none should ever be baked into a build.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

  # The Docker image is the deploy artifact; an image that stops building is a
  # broken deploy waiting to be discovered. Build it (no push) on every run.
  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
